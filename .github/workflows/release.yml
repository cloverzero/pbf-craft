name: Build and Release

on:
  push:
    tags:
      - "v*" # 每次打 tag 时触发，比如 v0.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build binaries for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pbf-craft dist/
          tar czf dist/pbf-craft-${{ matrix.target }}.tar.gz -C dist pbf-craft
          echo "Contents of dist:"
          ls -lh dist

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "target\${{ matrix.target}}\release\pbf-craft.exe" -Destination dist\
          Compress-Archive -Path dist\pbf-craft.exe -DestinationPath "dist\pbf-craft-${{ matrix.target }}.zip" -Force
          Get-ChildItem dist


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbf-craft-${{ matrix.target }}
          path: dist/

  # Publish both crates to crates.io. Order matters: pbf-craft-cli depends on the published
  # pbf-craft, so the library must be uploaded first (its publish verification resolves the
  # dependency from crates.io). Keep the crate versions and the CLI's `pbf-craft` dependency
  # version in sync with the release tag.
  #
  # Setup: create a crates.io API token (https://crates.io/settings/tokens, scope
  # "publish-new" or "publish-update") and store it as a repository secret named
  # CARGO_REGISTRY_TOKEN.
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run pbf-craft packaging
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run -p pbf-craft

      - name: Publish pbf-craft
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p pbf-craft

      - name: Publish pbf-craft-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p pbf-craft-cli

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Check built artifacts
        run: |
          echo "==> Files in workspace:"
          ls -R .
          echo "==> Files in dist:"
          ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.{tar.gz,zip}
          overwrite_files: true
          generate_release_notes: true
          
